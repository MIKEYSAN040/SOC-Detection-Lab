title: Detects suspicious MSHTA execution
id: 1111-2222-3333
status: experimental
description: Detecting execution of mshta.exe which is abused by attackers
author: Darshan K
date: 2026-08-20
logsource: 
  product: windows
  category: process creation
detection: 
  selection:
    Image|endswith: '\mshta.exe'

  condition: selection

falsepositives:
  - Legitimate HTA applications
  - Administrative scripts

level: medium