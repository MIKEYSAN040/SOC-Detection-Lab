title: Detect Suspicious Regsvr32 Remote Scriptlet Execution
id: 4c1d2f56-8f3a-4a89-92c3-3d5f9a0b7c11
status: experimental
description: Detects regsvr32.exe executing a remote scriptlet via scrobj.dll using the /i parameter (Squiblydoo technique).
author: Darshan K
date: 2026-08-22

logsource:
  product: windows
  category: process_creation

detection:
  selection_image:
    Image|endswith: '\regsvr32.exe'

  selection_commandline:
    CommandLine|contains|all:
      - '/i:'
      - 'http'
      - 'scrobj.dll'

  condition: selection_image and selection_commandline

falsepositives:
  - Rare administrative COM registration using remote scriptlets
  - Security testing or penetration testing activities

