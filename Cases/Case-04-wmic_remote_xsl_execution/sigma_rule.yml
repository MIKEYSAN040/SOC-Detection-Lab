title: Suspicious WMIC Remote XSL Execution
id: 
status: experimental
description: Detects WMIC process enumeration using an externally hosted XSL file, which may indicate XSL-based execution or abuse of WMIC.
author: Darshan
date: 2026-08-24
logsource:
    product: windows
    category: process_creation

detection:
    selection:
        Image|endswith: '\wmic.exe'
        CommandLine|contains|all:
            - 'process list'
            - '/format:'
            - 'http'
            - '.xsl'

    condition: selection

falsepositives:
    - Legitimate administrative or troubleshooting scripts using WMIC with remote XSL formatting



