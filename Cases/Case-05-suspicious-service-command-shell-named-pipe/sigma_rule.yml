title: Suspicious Service Installation Using Command Shell and Named Pipe
id: 
status: experimental
description: 
    Detects Windows service installations where the service executable
    launches the Windows command interpreter and interacts with a named
    pipe. This behavior may indicate privilege escalation, post-exploitation,
    or attacker abuse of Windows services.

author: Darshan
date: 2026-08-24

logsource:
    product: windows
    service: system

detection:
    selection:
        EventID: 7045

    command_shell:
        ImagePath|contains|all:
            - '%COMSPEC%'
            - '/c'

    named_pipe:
        ImagePath|contains:
            - '\\.\pipe\\'

    system_account:
        ServiceAccount: 'LocalSystem'

    condition: selection and command_shell and named_pipe and system_account

falsepositives:
    - Administrative scripts that intentionally install temporary services
    - Authorized software deployment or maintenance tools
    - Legitimate security or penetration testing tools
