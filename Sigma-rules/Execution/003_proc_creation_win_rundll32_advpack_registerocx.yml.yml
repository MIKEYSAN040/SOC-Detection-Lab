title: Suspicious Rundll32 Advpack RegisterOCX Execution
id: 
status: experimental
description: Detects suspicious execution of rundll32.exe using advpack.dll RegisterOCX observed in the imported Sysmon dataset.
author: Darshan
date: 2026/08/24

logsource:
  product: windows
  category: process_creation

detection:
  selection_image:
    Image|endswith: '\rundll32.exe'

  selection_advpack:
    EventData|contains:
      - 'advpack.dll'
      - 'RegisterOCX'

  selection_parent:
    ParentImage|endswith: '\cmd.exe'

  condition: selection_image and selection_advpack and selection_parent

falsepositives:
  - Legitimate software installation using advpack.dll RegisterOCX

